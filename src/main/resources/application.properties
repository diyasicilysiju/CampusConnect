server.port=8080

# MySQL Database Configuration
# Default is set to port 3300 and root123 for the local environment,
# with environment variables DB_HOST, DB_PORT, DB_NAME, DB_USERNAME, DB_PASSWORD supported.
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:campusconnect_db}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:hidden}
spring.datasource.password=${DB_PASSWORD:hidden}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# Static Resources
spring.web.resources.static-locations=classpath:/static/

# Session Management
server.servlet.session.timeout=60m
server.servlet.session.cookie.http-only=false
server.servlet.session.cookie.same-site=lax

# Logging
logging.level.com.campusconnect=INFO
logging.level.org.springframework.security=WARN
